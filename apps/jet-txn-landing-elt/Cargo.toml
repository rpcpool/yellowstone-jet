[package]
name = "jet-transaction-landing"
version = "0.3.0"
description = "ELT Tools to monitor and track transaction landed by jet."
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true }
bs58 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures = { workspace = true }
hyper = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter", "json"] }
url = { workspace = true, features = ["serde"] }
yellowstone-fumarole-client = { workspace = true }
yellowstone-grpc-proto = { workspace = true }

[lints]
workspace = true
