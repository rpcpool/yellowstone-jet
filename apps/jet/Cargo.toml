[package]
name = "yellowstone-jet"
version = "15.0.0"
description = "Yellowstone Jet"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bincode = { workspace = true }
borsh = { workspace = true }
bs58 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["cargo", "derive", "env"] }
derive_more = { workspace = true, features = ["display"] }
form_urlencoded = "1"
futures = { workspace = true }
hostname = { workspace = true }
http-body-util = { workspace = true }
humantime-serde = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["full"] }
jsonrpsee = { workspace = true, features = ["http-client", "macros", "server"] }
lazy_static = { workspace = true }
libc = { workspace = true }
maplit = { workspace = true }
pin-project = { workspace = true }
prometheus = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
quinn = { workspace = true }
quinn-proto = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
retry = { workspace = true }
rustls = { workspace = true, features = ["aws-lc-rs"] }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tikv-jemallocator = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter", "json"] }
uuid = { workspace = true, features = ["v4", "serde"] }
url = { workspace = true, features = ["serde"] }
# Agave Monorepo
solana-bincode = { workspace = true }
solana-client = { workspace = true }
solana-rpc-client = { workspace = true }
solana-rpc-client-api = { workspace = true }
# solana-streamer = { workspace = true, features = ["agave-unstable-api"] }
solana-system-interface = { workspace = true, features = ["bincode"] }
solana-tls-utils = { workspace = true, features = ["agave-unstable-api"] }
solana-transaction-status-client-types = { workspace = true }
solana-version = { workspace = true, features = ["agave-unstable-api"] }

# Solana SDK
solana-account = { workspace = true }
solana-clock = { workspace = true }
solana-commitment-config = { workspace = true }
solana-compute-budget-interface = { workspace = true }
solana-epoch-info = { workspace = true }
solana-epoch-schedule = { workspace = true }
solana-hash = { workspace = true, features = ["atomic"] }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-message = { workspace = true }
solana-native-token = { workspace = true }
solana-nonce = { workspace = true }
solana-packet = { workspace = true }
solana-pubkey = { workspace = true }
solana-quic-definitions = { workspace = true }
solana-sdk-ids = { workspace = true }
solana-signature = { workspace = true, features = ["rand"] }
solana-signer = { workspace = true }
solana-transaction = { workspace = true }
solana-transaction-error = { workspace = true }
solana-leader-schedule = { workspace = true, features = ["agave-unstable-api"] }

# Yellowstone
yellowstone-grpc-client = { workspace = true }
yellowstone-grpc-proto = { workspace = true }
yellowstone-jet-tpu-client = { workspace = true, default-features = false, features = ["prometheus", "yellowstone-grpc", "shield", "txn-info-cap-128"] }
yellowstone-shield-store = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
cargo-lock = { workspace = true }
git-version = { workspace = true }
vergen = { workspace = true, features = ["build", "rustc"] }

[lints]
workspace = true
