[package]
name = "example-jet-vault-identity"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "jet-vault-identity"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
bs58 = "0.5.1"
vaultrs = { version = "0.8.0", default-features = false, features = ["rustls"] }
serde_json = "1.0.116"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }

# Solana SDK
solana-keypair = "3.0.0"
solana-signer = "3.0.0"
